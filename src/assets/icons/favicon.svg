<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Multi-Spectrum Horizontal Equalizer Gradient -->
    <linearGradient id="spectrumGrad" gradientUnits="userSpaceOnUse" x1="8" y1="32" x2="56" y2="32">
      <stop offset="0%" stop-color="#c026d3" />
      <stop offset="22%" stop-color="#f43f5e" />
      <stop offset="48%" stop-color="#f97316" />
      <stop offset="68%" stop-color="#eab308" />
      <stop offset="86%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Golden-Amber Main Swoosh Body Gradient -->
    <linearGradient id="swooshGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Crimson-Coral Lower Edge Gradient -->
    <linearGradient id="swooshRed" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Soft Outer Glow for Bars -->
    <filter id="barGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow for the 3D Swoosh -->
    <filter id="swooshShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Spectrum Equalizer Bars (Transparent Background) -->
  <g filter="url(#barGlow)" fill="url(#spectrumGrad)">
    <rect x="8.5" y="28.5" width="1.9" height="7" rx="0.95" />
    <rect x="11.5" y="25.5" width="1.9" height="13" rx="0.95" />
    <rect x="14.5" y="22.5" width="1.9" height="19" rx="0.95" />
    <rect x="17.5" y="19" width="1.9" height="26" rx="0.95" />
    <rect x="20.5" y="21.5" width="1.9" height="21" rx="0.95" />
    <rect x="23.5" y="15.5" width="1.9" height="33" rx="0.95" />
    <rect x="26.5" y="18" width="1.9" height="28" rx="0.95" />
    <rect x="29.5" y="11" width="1.9" height="42" rx="0.95" />
    <rect x="32.5" y="7" width="2.1" height="50" rx="1.05" />
    <rect x="35.7" y="13" width="1.9" height="38" rx="0.95" />
    <rect x="38.7" y="17" width="1.9" height="30" rx="0.95" />
    <rect x="41.7" y="20" width="1.9" height="24" rx="0.95" />
    <rect x="44.7" y="18.5" width="1.9" height="27" rx="0.95" />
    <rect x="47.7" y="22" width="1.9" height="20" rx="0.95" />
    <rect x="50.7" y="24.5" width="1.9" height="15" rx="0.95" />
    <rect x="53.7" y="27.5" width="1.9" height="9" rx="0.95" />
  </g>

  <!-- Diagonal 3D Golden-Coral Crescent Swoosh (Zero Gap Between Colors) -->
  <g filter="url(#swooshShadow)">
    <!-- Full Outer Crescent Base in Crimson-Coral -->
    <path d="M 14.2 48.8 C 12.2 44.5, 16.5 34.5, 27.5 26.8 C 38.5 19, 50.2 17.2, 53.5 20.5 C 55.2 22.8, 52.5 27.5, 46 33.5 C 36.5 42.2, 23 48.8, 15.8 50.2 C 14.8 50.4, 14.4 49.5, 14.2 48.8 Z" fill="url(#swooshRed)" />

    <!-- Upper Golden-Amber Body Sharing the Exact Dividing Curve -->
    <path d="M 14.2 48.8 C 12.2 44.5, 16.5 34.5, 27.5 26.8 C 38.5 19, 50.2 17.2, 53.5 20.5 C 44.5 31.2, 27.5 42.2, 14.2 48.8 Z" fill="url(#swooshGold)" />

    <!-- Glossy Specular Highlight -->
    <ellipse cx="46.2" cy="23.2" rx="3.4" ry="1.35" transform="rotate(-28 46.2 23.2)" fill="#ffffff" opacity="0.88" />
  </g>
</svg>